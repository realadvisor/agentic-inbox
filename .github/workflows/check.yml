name: Inbox CI and release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: inbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inbox
          POSTGRES_PASSWORD: inbox_test
          POSTGRES_DB: inbox_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inbox -d inbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://inbox:inbox_test@127.0.0.1:5432/inbox_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node --import tsx --test tests/*.test.ts
      - run: pnpm deploy:check
      - name: Save validated frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: inbox-frontend-${{ github.sha }}
          path: build/client
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://inbox.realadvisor.com
    steps:
      - name: Ignore superseded releases
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [[ "$current" == "$RELEASE_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped: this commit has been superseded on main.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
        if: steps.release.outputs.current == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        if: steps.release.outputs.current == 'true'
      - uses: actions/setup-node@v4
        if: steps.release.outputs.current == 'true'
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        if: steps.release.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.current == 'true'
        with:
          name: inbox-frontend-${{ github.sha }}
          path: build/client
      - name: Validate release credentials
        if: steps.release.outputs.current == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [[ -n "$DATABASE_URL" ]] || { echo '::error::Missing production DATABASE_URL secret'; exit 1; }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo '::error::Missing production CLOUDFLARE_API_TOKEN secret'; exit 1; }
          node scripts/deploy-preflight.mjs
          pnpm exec wrangler whoami
      - name: Apply database migrations
        if: steps.release.outputs.current == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --import tsx scripts/migrate.ts
      - name: Deploy Worker, frontend, queues, and schedule
        if: steps.release.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler deploy
      - name: Verify protected site responds
        if: steps.release.outputs.current == 'true'
        run: |
          status=$(curl --silent --show-error --retry 3 --retry-all-errors --max-time 30 --output /dev/null --write-out '%{http_code}' https://inbox.realadvisor.com/)
          [[ "$status" == '200' || "$status" == '302' ]] || { echo "::error::Unexpected live response: $status"; exit 1; }
          echo "Released $GITHUB_SHA to https://inbox.realadvisor.com. HTTP $status (302 is the Cloudflare Access login redirect)." >> "$GITHUB_STEP_SUMMARY"
